[project]
name = "walkie"
version = "3.0.0"
description = "Serverless peer-to-peer walkie-talkie application for LAN"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["walkie-talkie", "lan", "voice", "p2p", "encrypted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "cryptography>=41.0",
    "pystray>=0.19",
    "Pillow>=10.0",
    "av>=12.0",
    "pygobject>=3.56.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/Lunixizm0/walkie"
Repository = "https://github.com/Lunixizm0/walkie"
Issues = "https://github.com/Lunixizm0/walkie/issues"

[project.scripts]
walkie = "walkie.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
